services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon
      POSTGRES_DB: horizon
    ports:
      - "5432:5432"
    volumes:
      - horizon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://horizon:horizon@postgres:5432/horizon?sslmode=disable
      HORIZON_SERVER_ADDR: ":8080"
      HORIZON_BASE_DOMAIN: localhost
      HORIZON_PUBLIC_SCHEME: http
      HORIZON_PUBLIC_PORT: ":8080"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  horizon_pg:
